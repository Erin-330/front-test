<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title" class="login-title">로그인</h1>
      <p class="login-subtitle">계정에 로그인하여 시작하세요</p>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
          <span class="error-message" id="email-error" role="alert"></span>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="비밀번호를 입력하세요"
              required
              minlength="8"
            />
            <button type="button" class="toggle-password" id="toggle-password" aria-label="비밀번호 표시">
              표시
            </button>
          </div>
          <span class="error-message" id="password-error" role="alert"></span>
        </div>

        <div class="form-options">
          <label class="checkbox">
            <input type="checkbox" id="remember" name="remember" />
            <span>로그인 상태 유지</span>
          </label>
          <a href="#" class="forgot-link">비밀번호 찾기</a>
        </div>

        <button type="submit" class="submit-button">로그인</button>
      </form>

      <p class="signup-prompt">
        계정이 없으신가요? <a href="#">회원가입</a>
      </p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
